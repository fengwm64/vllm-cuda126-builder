name: Build vLLM Runtime Image (CUDA 12.6)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vllm-openai

on:
  workflow_dispatch:
    inputs:
      vllm_version:
        description: "vLLM version (e.g. v0.20.1)"
        required: true
        default: "v0.20.1"
        type: string
      wheel_release_tag:
        description: "GitHub Release tag containing the wheel (e.g. v0.20.1-wheel)"
        required: true
        default: "v0.20.1-wheel"
        type: string
      wheel_filename:
        description: "Wheel filename in the release"
        required: true
        default: "vllm-0.20.2.dev0+g132765e35.d20260509.cu126-cp312-cp312-linux_x86_64.whl"
        type: string
      torch_cuda_arch_list:
        description: "CUDA SM versions (space-separated, e.g. '8.0 8.6')"
        required: true
        default: "8.0 8.6"
        type: string

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve parameters
        id: params
        run: |
          VERSION="${{ inputs.vllm_version }}"
          SM_SUFFIX=$(echo "${{ inputs.torch_cuda_arch_list }}" | sed 's/ /-/g; s/\./sm/g')
          WHEEL_URL="https://github.com/${{ github.repository }}/releases/download/${{ inputs.wheel_release_tag }}/${{ inputs.wheel_filename }}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sm_suffix=${SM_SUFFIX}" >> $GITHUB_OUTPUT
          echo "wheel_url=${WHEEL_URL}" >> $GITHUB_OUTPUT
          echo "wheel_file=${{ inputs.wheel_filename }}" >> $GITHUB_OUTPUT

      - name: Download pre-built wheel
        run: |
          mkdir -p ./wheels
          echo "Downloading: ${{ steps.params.outputs.wheel_url }}"
          curl -fSL -o "./wheels/${{ steps.params.outputs.wheel_file }}" "${{ steps.params.outputs.wheel_url }}"
          ls -lh ./wheels/*.whl

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.runtime
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.params.outputs.version }}-cu126
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.params.outputs.version }}-cu126-${{ steps.params.outputs.sm_suffix }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-cu126
          labels: |
            org.opencontainers.image.title=vLLM OpenAI Server
            org.opencontainers.image.description=vLLM OpenAI-compatible API server (CUDA 12.6)
            org.opencontainers.image.version=${{ steps.params.outputs.version }}
            com.nvidia.cuda.version=12.6
            com.nvidia.gpu.arch=${{ inputs.torch_cuda_arch_list }}
          build-args: |
            VLLM_WHEEL=wheels/${{ steps.params.outputs.wheel_file }}
            TORCH_CUDA_ARCH_LIST=${{ inputs.torch_cuda_arch_list }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Summary
        run: |
          GPU_MAP=""
          for sm in ${{ inputs.torch_cuda_arch_list }}; do
            case "$sm" in
              7.5) GPU_MAP="$GPU_MAP\n| SM 7.5 | Turing | RTX 2080, T4, GTX 1660 |" ;;
              8.0) GPU_MAP="$GPU_MAP\n| SM 8.0 | Ampere | A100, A6000, A40 |" ;;
              8.6) GPU_MAP="$GPU_MAP\n| SM 8.6 | Ampere | RTX 3090, RTX 3080, A40 |" ;;
              8.9) GPU_MAP="$GPU_MAP\n| SM 8.9 | Ada Lovelace | RTX 4090, L40, L4 |" ;;
              9.0) GPU_MAP="$GPU_MAP\n| SM 9.0 | Hopper | H100, H200 |" ;;
              *)   GPU_MAP="$GPU_MAP\n| SM $sm | Unknown | Unknown |" ;;
            esac
          done

          echo "## Build Complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| vLLM Version | \`${{ steps.params.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CUDA Base | 12.6.0 |" >> $GITHUB_STEP_SUMMARY
          echo "| Compute Capabilities | \`${{ inputs.torch_cuda_arch_list }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Wheel Source | \`${{ inputs.wheel_release_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Supported GPUs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| SM Version | Architecture | GPUs |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|-------------|------|" >> $GITHUB_STEP_SUMMARY
          echo -e "$GPU_MAP" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull commands" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.params.outputs.version }}-cu126" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.params.outputs.version }}-cu126-${{ steps.params.outputs.sm_suffix }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Run" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker run --gpus all -p 8000:8000 \\" >> $GITHUB_STEP_SUMMARY
          echo "  -v ~/.cache/huggingface:/root/.cache/huggingface \\" >> $GITHUB_STEP_SUMMARY
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.params.outputs.version }}-cu126 \\" >> $GITHUB_STEP_SUMMARY
          echo "  --model meta-llama/Llama-3-8B-Instruct \\" >> $GITHUB_STEP_SUMMARY
          echo "  --max-model-len 4096" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
